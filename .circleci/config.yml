version: 2.1

jobs:
  build-and-analyze:
    docker:
      - image: cimg/android:2024.01.1
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Install SonarScanner and run analysis
          command: |
            # Install SonarScanner
            wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
            unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
            export PATH="$PATH:$(pwd)/sonar-scanner-5.0.1.3006-linux/bin"
            
            # Build and test
            chmod +x ./gradlew
            ./gradlew build test
            
            # Run SonarScanner analysis
            sonar-scanner \
              -Dsonar.projectKey=Liyakhanya_app \
              -Dsonar.organization=liyakhanya \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.sources=app/src/main/java \
              -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes,app/build/tmp/kotlin-classes/debug \
              -Dsonar.junit.reportsPath=app/build/test-results/test \
              -Dsonar.sourceEncoding=UTF-8
      
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/reports

workflows:
  version: 2
  main:
    jobs:
      - build-and-analyze
