version: 2.1

jobs:
  test-new-token:
    docker:
      - image: cimg/android:2024.01.1
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Test new SonarCloud token
          command: |
            echo "=== Testing with new token ==="
            
            # Test API access
            echo "1. Testing API connectivity..."
            curl -s -u "$SONAR_TOKEN": "https://sonarcloud.io/api/system/status" | python3 -m json.tool
            
            echo "2. Listing accessible projects..."
            curl -s -u "$SONAR_TOKEN": "https://sonarcloud.io/api/projects/search" | python3 -c "
import json, sys
data = json.load(sys.stdin)
print(f'Total projects: {data.get(\"paging\", {}).get(\"total\", 0)}')
for project in data.get('components', []):
    print(f'✓ {project[\"key\"]} - {project[\"name\"]}')
" || echo "No projects found"
            
            echo "3. Testing project-specific access..."
            curl -s -u "$SONAR_TOKEN": "https://sonarcloud.io/api/projects/search?projects=Liyakhanya_ObseliteAthleteWeb-MobileApp" | python3 -m json.tool

workflows:
  version: 2
  main:
    jobs:
      - test-new-token
