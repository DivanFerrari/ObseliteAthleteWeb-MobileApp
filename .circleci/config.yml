version: 2.1

jobs:
  test-new-token:
    docker:
      - image: cimg/android:2024.01.1
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Test SonarCloud token
          command: |
            echo "Testing SonarCloud access with new token..."
            
            # Simple test - just check if we can access the API
            response=$(curl -s -u "$SONAR_TOKEN": "https://sonarcloud.io/api/system/status")
            
            if echo "$response" | grep -q "UP"; then
              echo "✅ SonarCloud API is accessible"
            else
              echo "❌ Cannot access SonarCloud API"
              echo "Response: $response"
            fi
            
            # List projects
            echo "Listing projects..."
            curl -s -u "$SONAR_TOKEN": "https://sonarcloud.io/api/projects/search" | grep -o '"key":"[^"]*"' | head -10

workflows:
  version: 2
  main:
    jobs:
      - test-new-token
