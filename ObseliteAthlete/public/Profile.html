<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Obselite Athlete</title>
    <link rel="stylesheet" href="assets/css/donate.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .profile-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
        }

            .profile-info p {
                margin: 10px 0;
                font-size: 16px;
            }

            .profile-info strong {
                color: #333;
                min-width: 120px;
                display: inline-block;
            }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .text-danger {
            color: #dc3545;
        }

        .text-muted {
            color: #6c757d;
        }

        .text-center {
            text-align: center;
        }

        .mt-4 {
            margin-top: 30px;
        }

        .me-1 {
            margin-right: 5px;
        }

        .me-2 {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="card">
            <div class="donatecontainer">
                <h2 class="donateheader"><i class="fas fa-user-circle me-2"></i>My Profile</h2>
            </div>

            <div id="profile-info" class="profile-card">
                <div class="text-center">
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Loading your profile...</p>
                </div>
            </div>

            <div class="btn-group mt-4">
                <a href="index.html" class="backbtn">
                    <i class="fas fa-arrow-left me-1"></i>Back to Home
                </a>
                <button onclick="logoutUser()" class="backbtn" style="background: #dc3545; color: white; border-color: #dc3545;">
                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjvzocgNxRbVq2Re4P4wPrlFYUXLqQVIs",
            authDomain: "oawebsite-569ef.firebaseapp.com",
            projectId: "oawebsite-569ef",
            storageBucket: "oawebsite-569ef.appspot.com",
            messagingSenderId: "743749509769",
            appId: "1:743749509769:web:6b56c73620951d59229c58",
            databaseURL: "https://oawebsite-569ef-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, async (user) => {
            const profileInfo = document.getElementById('profile-info');

            if (user) {
                try {
                    const userRef = ref(db, `users/${user.uid}`);
                    const snapshot = await get(userRef);

                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        profileInfo.innerHTML = `
                            <div class="profile-info">
                                <p><strong>Name:</strong> ${userData.name || 'Not provided'}</p>
                                <p><strong>Email:</strong> ${user.email}</p>
                                <p><strong>Member since:</strong> ${userData.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'Recently'}</p>
                                <p><strong>User ID:</strong> ${user.uid.substring(0, 8)}...</p>
                                <p class="text-muted"><i class="fas fa-info-circle me-1"></i>Thank you for being part of Obselite Athlete!</p>
                            </div>
                        `;
                    } else {
                        profileInfo.innerHTML = `
                            <div class="profile-info">
                                <p><strong>Email:</strong> ${user.email}</p>
                                <p><strong>User ID:</strong> ${user.uid.substring(0, 8)}...</p>
                                <p class="text-muted"><i class="fas fa-exclamation-triangle me-1"></i>Complete your profile setup</p>
                            </div>
                        `;
                    }
                } catch (error) {
                    profileInfo.innerHTML = `
                        <div class="profile-info">
                            <p class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>Error loading profile: ${error.message}</p>
                        </div>
                    `;
                }
            } else {
                profileInfo.innerHTML = `
                    <div class="profile-info text-center">
                        <p><i class="fas fa-user-slash me-1"></i>You are not logged in</p>
                        <p>Please <a href="Authentication.html" style="color: #dc3545; font-weight: 600;">login</a> to view your profile.</p>
                    </div>
                `;
            }
        });

        window.logoutUser = async function() {
            try {
                await signOut(auth);

                const profileInfo = document.getElementById('profile-info');
                profileInfo.innerHTML = `
                    <div class="profile-info text-center">
                        <p><i class="fas fa-check-circle me-1" style="color: #28a745;"></i>Successfully logged out!</p>
                        <p>Redirecting to home page...</p>
                    </div>
                `;

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (error) {
                alert("Logout error: " + error.message);
            }
        };
    </script>
</body>
</html>
