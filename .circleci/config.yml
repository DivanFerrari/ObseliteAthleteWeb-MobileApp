version: 2.1

jobs:
  build-and-analyze:
    docker:
      - image: cimg/android:2024.01.1
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Build project
          command: |
            chmod +x ./gradlew
            ./gradlew assemble
      
      - run:
          name: Install SonarScanner and run analysis
          command: |
            # Install SonarScanner
            wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
            unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
            
            # Run SonarScanner analysis with CORRECT project key
            ./sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner \
              -Dsonar.projectKey=Liyakhanya_ObseliteAthleteWeb-MobileApp \
              -Dsonar.organization=liyakhanya \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.sources=app/src/main/java \
              -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes,app/build/tmp/kotlin-classes/debug
      
      - store_artifacts:
          path: app/build/outputs

workflows:
  version: 2
  main:
    jobs:
      - build-and-analyze
