version: 2.1

jobs:
  build-and-analyze:
    docker:
      - image: cimg/android:2024.01.1
    working_directory: ~/project
    steps:
      - checkout
      
      # Remove cache for now to avoid path errors
      # - restore_cache:
      #     keys:
      #       - gradle-cache-{{ checksum "gradle.properties" }}
      
      - run:
          name: Check project structure
          command: |
            echo "=== Project Structure ==="
            ls -la
            echo "=== Gradle Files ==="
            find . -name "*.gradle" -type f
            echo "=== Root build.gradle content ==="
            cat build.gradle || echo "No build.gradle in root"
      
      - run:
          name: Install SonarScanner manually
          command: |
            wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
            unzip sonar-scanner-cli-5.0.1.3006-linux.zip
            export PATH="$PATH:$(pwd)/sonar-scanner-5.0.1.3006-linux/bin"
      
      - run:
          name: Build project
          command: |
            chmod +x ./gradlew
            ./gradlew build || echo "Build may have warnings"
      
      - run:
          name: Run tests
          command: |
            chmod +x ./gradlew
            if ./gradlew tasks | grep -q "test"; then
              ./gradlew test
            else
              echo "No test task found"
            fi
      
      - run:
          name: SonarScanner analysis (standalone)
          command: |
            # Use standalone SonarScanner instead of Gradle plugin
            sonar-scanner \
              -Dsonar.projectKey=Liyakhanya_app \
              -Dsonar.organization=liyakhanya \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.sources=app/src/main/java \
              -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes,app/build/tmp/kotlin-classes/debug \
              -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml \
              -Dsonar.junit.reportsPath=app/build/test-results/test \
              -Dsonar.sourceEncoding=UTF-8
      
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/reports

workflows:
  version: 2
  main:
    jobs:
      - build-and-analyze
